<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Bilenay Trade Desk</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DB1FF"/><stop offset="1" stop-color="#3F78E0"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2232"/><stop offset="1" stop-color="#0B0F16"/></linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.1" r="0.75"><stop offset="0" stop-color="#7DB1FF" stop-opacity="0.16"/><stop offset="1" stop-color="#7DB1FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE8C"/><stop offset="1" stop-color="#26B068"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7808A"/><stop offset="1" stop-color="#DE505C"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DB1FF"/><stop offset="1" stop-color="#3F78E0"/></linearGradient>
  </defs>
  <rect x="20" y="20" width="984" height="984" rx="228" fill="url(#ring)"/>
  <rect x="46" y="46" width="932" height="932" rx="204" fill="url(#body)"/>
  <rect x="46" y="46" width="932" height="932" rx="204" fill="url(#glow)"/>
  <!-- red pullback -->
  <rect x="294" y="410" width="24" height="360" rx="12" fill="url(#red)"/>
  <rect x="244" y="500" width="124" height="190" rx="28" fill="url(#red)"/>
  <!-- green pushes -->
  <rect x="500" y="300" width="24" height="400" rx="12" fill="url(#green)"/>
  <rect x="450" y="360" width="124" height="280" rx="28" fill="url(#green)"/>
  <rect x="706" y="190" width="24" height="410" rx="12" fill="url(#green)"/>
  <rect x="656" y="250" width="124" height="290" rx="28" fill="url(#green)"/>
  <!-- base line -->
  <rect x="214" y="806" width="596" height="36" rx="18" fill="url(#line)"/>
</svg>
