name: Build apps
# Builds Windows, macOS (Apple Silicon + Intel) and Linux. PyInstaller can not cross-compile, so each system is
# built on its own runner. Manual run: Actions tab -> Build apps -> Run workflow (downloadable artifacts).
# Push a tag such as v0.7.3 and one GitHub Release with all four files + SHA256SUMS.txt is published.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,     os: windows-latest }
          - { name: macos-arm64, os: macos-15 }          # Apple Silicon
          - { name: macos-intel, os: macos-15-intel }    # Intel Macs
          - { name: linux,       os: ubuntu-22.04 }      # oldest current Ubuntu image = widest Linux compatibility
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The app may sit in the repo root or in a sub-folder: find the folder that holds main.py + tradedesk/
      - name: Find the app folder
        shell: python
        run: |
          import os, pathlib
          for main in sorted(pathlib.Path(".").rglob("main.py")):
              if (main.parent / "tradedesk").is_dir() and ".git" not in main.parts:
                  with open(os.environ["GITHUB_ENV"], "a") as env:
                      env.write(f"APP_DIR={main.parent.resolve()}\n")
                  print("App folder:", main.parent.resolve())
                  break
          else:
              raise SystemExit("main.py with a tradedesk/ folder was not found in the repository")

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - run: python -m pip install -r requirements-dev.txt pyinstaller
        working-directory: ${{ env.APP_DIR }}
      - run: python -m pytest -q
        working-directory: ${{ env.APP_DIR }}
      - name: Build and pack (build.py checks that Tk 8.6+ is available)
        run: python build.py
        working-directory: ${{ env.APP_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: BilenayTradeDesk-${{ matrix.name }}
          path: ${{ env.APP_DIR }}/release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BilenayTradeDesk-*
          merge-multiple: true
          path: release

      - name: Release notes and checksums
        run: |
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.lstrip("v")
          changelog = next(p for p in pathlib.Path(".").rglob("CHANGELOG.md") if ".git" not in p.parts)
          notes, on = [], False
          for line in changelog.read_text(encoding="utf-8").splitlines():
              if line.startswith("## "):
                  if on:
                      break
                  if line.strip() == f"## {ver}":
                      on = True
                      continue
              elif on:
                  notes.append(line)
          head = f"""### Downloads
          - **Windows 10/11:** `BilenayTradeDesk-{tag}-windows.zip`
          - **macOS, Apple Silicon (M1 or newer):** `BilenayTradeDesk-{tag}-macos-arm64.zip`
          - **macOS, Intel:** `BilenayTradeDesk-{tag}-macos-intel.zip`
          - **Linux (64-bit):** `BilenayTradeDesk-{tag}-linux.tar.gz`

          The apps are not code-signed, so Windows and macOS show a warning on first start (see the README for the
          two clicks). Check a download with `SHA256SUMS.txt`.

          """
          head = "\n".join(line.lstrip() for line in head.splitlines())
          body = head + "\n" + "\n".join(notes).strip() if notes else head
          pathlib.Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PY
          cd release
          sha256sum BilenayTradeDesk-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Bilenay Trade Desk ${{ github.ref_name }}
          files: release/*
          body_path: release_notes.md
