name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --clean --onedir --windowed --name TradeHub --icon assets/icon.ico --hidden-import PIL._tkinter_finder main.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/TradeHub -DestinationPath "TradeHub-${{ github.ref_name }}-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TradeHub-windows
          path: TradeHub-*-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TradeHub-*-windows.zip
          generate_release_notes: true
