name: Build Windows exe
on:
  workflow_dispatch:          # manual: Actions tab -> Build Windows exe -> Run workflow
  push:
    tags: ["v*"]              # tagging v0.3.1 etc. builds the exe and publishes a GitHub Release
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --clean --onedir --windowed --name TradeHub --icon assets/icon.ico --add-data "assets;assets" --hidden-import PIL._tkinter_finder main.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/TradeHub -DestinationPath "TradeHub-${{ github.ref_name }}-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TradeHub-windows
          path: TradeHub-*-windows.zip
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $out = @(); $on = $false
          foreach ($l in (Get-Content CHANGELOG.md)) {
            if ($l -match '^## ') { if ($on) { break }; if ($l.Trim() -eq "## $ver") { $on = $true; continue } }
            if ($on) { $out += $l }
          }
          if ($out.Count -eq 0) { $out = @("TradeHub $ver") }
          Set-Content -Path release_notes.md -Value $out -Encoding utf8
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TradeHub-*-windows.zip
          body_path: release_notes.md
